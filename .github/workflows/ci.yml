name: ci
on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

# 连续 push 只跑最新提交（过期 run 自动取消，省 runner 时长）
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      mode: ${{ steps.classify.outputs.mode }}
      runtime: ${{ steps.classify.outputs.runtime }}
      references: ${{ steps.classify.outputs.references }}
      plan: ${{ steps.classify.outputs.plan }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Tiered gate negative checks
        run: python3 scripts/test-quality-gate.py
      - name: Document checker negative checks
        run: python3 scripts/test-check-docs.py
      - name: Reference checker negative checks
        run: python3 scripts/test-check-references.py
      - name: Classify exact push or PR change window
        id: classify
        run: python3 scripts/quality-gate.py classify --kind taskrunner --event-path "$GITHUB_EVENT_PATH" --head "$GITHUB_SHA" --github-output "$GITHUB_OUTPUT"
  document-check:
    if: always()
    needs: [changes]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      QUALITY_PLAN: ${{ needs.changes.outputs.plan }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Check changed documents and local links
        run: python3 scripts/check-docs.py --plan-env QUALITY_PLAN
  reference-check:
    if: needs.changes.outputs.references == 'true'
    needs: [changes]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      QUALITY_PLAN: ${{ needs.changes.outputs.plan }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Validate affected candidate schemas and isolated references
        run: python3 scripts/check-references.py --plan-env QUALITY_PLAN
  commit-policy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Commit policy negative checks
        run: make test-commit-lint
      - name: Exact push or PR commit window
        run: python3 scripts/commit-policy.py ci --fetch-missing
  test:
    needs: [changes]
    if: needs.changes.outputs.runtime == 'true'
    runs-on: ubuntu-latest
    env:
      GOTOOLCHAIN: local
    timeout-minutes: 15 # testcontainers/PG 挂起时兜底（默认 6h）
    services:
      redis:
        image: redis:8.2.11-alpine3.22@sha256:da23c2478319ceb4903857d77a2fd7aa5137d9e9d4c8165dafbacedac6403e95
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 5s --health-retries 10
      postgres:
        image: postgres:18.6-trixie@sha256:e3d24f6906d0760bf4da0dae872415391ededefad23fd471c47dc53b0ddf3c42
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: taskrunner_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: vet
        run: go vet ./...
      - name: gofmt
        run: test -z "$(gofmt -l .)"
      - name: unit (race)
        run: go test -race ./...
      - name: integration (PG, race)
        env:
          TASKRUNNER_TEST_PG_DSN: postgres://postgres:postgres@localhost:5432/taskrunner_test?sslmode=disable
          TASKRUNNER_TEST_REDIS_ADDR: localhost:6379
        run: go test -race -count=1 ./...
      - name: Real delivery E2E (SQLite, Redis, signed HTTP and cron)
        env:
          E2E_INCLUDE_CRON: "1"
        run: make e2e
      - name: Vulnerability scan (current source and tests)
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 -test ./...
      - name: Vulnerability scan (current binary)
        env:
          CGO_ENABLED: "0"
        run: |
          go build -trimpath -o "$RUNNER_TEMP/taskrunner" ./cmd/taskrunner
          go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 -mode=binary "$RUNNER_TEMP/taskrunner"
  quality-gate:
    if: always()
    needs: [changes, commit-policy, document-check, reference-check, test]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      QUALITY_PLAN: ${{ needs.changes.outputs.plan }}
      NEEDS_JSON: ${{ toJSON(needs) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Require all applicable jobs to succeed
        run: python3 scripts/quality-gate.py summarize --plan-env QUALITY_PLAN --needs-env NEEDS_JSON --runtime-jobs test
