# taskrunner 部署态 compose（M3/D 阶段交付物；开发态 = 仓库根 configs/config.yaml + 宿主进程）。
#
# 拓扑（C3 网络隔离，对齐 activelist D5 双 network 模式）：taskrunner 跨双网——
# taskrunner_internal（PG/Redis 仅内网可达）与 zhuzhao_to_taskrunner（external，
# 由部署侧预建：docker network create zhuzhao_to_taskrunner；zhuzhao app 容器须加入
# 同一网络并以 http://taskrunner:8080 寻址本服务）。本栈全部服务【不对宿主发布端口】，
# zhuzhao 经共享网反代式调用；回调由本服务主动拨 zhuzhao（callback URL 由 zhuzhao 下发）。
#
# 环境变量（.env 或 export）——五项均必填，缺失 compose 直接报错拒建（fail-closed，
# 对齐 activelist compose.prod 与主仓 W0 三件套纪律；本地起栈的 .env 快配见 deploy/README.md）：
#   TASKRUNNER_PG_PASSWORD        taskrunner 专用 PG 口令
#   TASKRUNNER_REDIS_PASSWORD     本栈 Redis 口令
#   TASKRUNNER_CALLER_ZHUZHAO_SK  zhuzhao 出站签名 SK（须与 zhuzhao 侧 TASKRUNNER_SK 同值）；
#                                 应用对空 SK 亦 fail-closed 拒启——不给弱缺省，
#                                 防生产忘配 env 时以公开弱密钥起栈、验签形同虚设
#   TASKRUNNER_SELF_SK            回调签名 SK（须与 zhuzhao 侧 INTERNAL_JOBS_SK 同值）
#   TASKRUNNER_CALLBACK_TARGET_URL  唯一出站回调目标（W0b SSRF 收口）
#
# 存储：job_runs/jobs 落专用 PG（C7 拍板，联调只用 PG）；asynq 队列落本栈 Redis。
# 备份：每日 02:00 pg_dump（pgbackup 服务，保留 14 份；恢复见 deploy/backup/README.md）。
# job_runs 保留期口径 M4 一并拍——保留期调整=改 pgbackup 的 RETAIN_COUNT。
name: taskrunner

services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: taskrunner
      POSTGRES_PASSWORD: ${TASKRUNNER_PG_PASSWORD:?需注入 TASKRUNNER_PG_PASSWORD}
      POSTGRES_DB: taskrunner
      TZ: Asia/Shanghai
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - taskrunner_internal
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U taskrunner -d taskrunner"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:6.2-alpine
    environment:
      REDIS_PASSWORD: ${TASKRUNNER_REDIS_PASSWORD:?需注入 TASKRUNNER_REDIS_PASSWORD}
    command: ["sh", "-c", "redis-server --requirepass \"$$REDIS_PASSWORD\""]
    volumes:
      - redisdata:/data
    networks:
      - taskrunner_internal
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "redis-cli --no-auth-warning -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 10

  taskrunner:
    build: ..
    image: taskrunner:latest
    environment:
      # 存储（C7）：PG 形态，表结构由应用启动自建（CREATE TABLE IF NOT EXISTS）
      TASKRUNNER_DB_DRIVER: pg
      TASKRUNNER_DB_HOST: postgres
      TASKRUNNER_DB_PORT: "5432"
      TASKRUNNER_DB_USER: taskrunner
      TASKRUNNER_DB_PASSWORD: ${TASKRUNNER_PG_PASSWORD}
      TASKRUNNER_DB_NAME: taskrunner
      TASKRUNNER_DB_SSLMODE: disable
      # asynq 队列（本栈 Redis，独立键空间归属本服务）
      TASKRUNNER_REDIS_ADDR: redis:6379
      TASKRUNNER_REDIS_PASSWORD: ${TASKRUNNER_REDIS_PASSWORD:?需注入 TASKRUNNER_REDIS_PASSWORD}
      TASKRUNNER_REDIS_DB: "0"
      # AK/SK 密钥环（与 zhuzhao 侧对值：TASKRUNNER_SK / INTERNAL_JOBS_SK）
      TASKRUNNER_CALLER_ZHUZHAO_SK: ${TASKRUNNER_CALLER_ZHUZHAO_SK:?需注入 TASKRUNNER_CALLER_ZHUZHAO_SK（与 zhuzhao 侧 TASKRUNNER_SK 同值）}
      TASKRUNNER_SELF_AK: taskrunner
      TASKRUNNER_SELF_SK: ${TASKRUNNER_SELF_SK:?需注入 TASKRUNNER_SELF_SK（与 zhuzhao 侧 INTERNAL_JOBS_SK 同值）}
      # 重试上限（默认 5；E 阶段演练曾临时置 0 快速造 dead 靶标）
      TASKRUNNER_MAX_RETRY: ${TASKRUNNER_MAX_RETRY:-5}
      # W0b SSRF 收口：唯一出站回调目标（zhuzhao 内网回调端点）——无兜底必填
      TASKRUNNER_CALLBACK_TARGET_URL: ${TASKRUNNER_CALLBACK_TARGET_URL:?required — http://zhuzhao:33333/internal/jobs/callback}
      # ── P4-2 死信告警（默认关闭；开启时 AK/SK 须与 zhuzhao /internal 验签对齐）──
      # TASKRUNNER_NOTIFY_TARGET_URL: http://zhuzhao:33333/internal/notify/dead-letter
      # TASKRUNNER_NOTIFY_AK: taskrunner        # 必须恒 taskrunner（=internal_jobs.taskrunner_ak）
      # TASKRUNNER_NOTIFY_SK: ${TASKRUNNER_SELF_SK}  # 必须与 SELF_SK 同值（zhuzhao INTERNAL_JOBS_SK）
    networks:
      taskrunner_internal: {}
      zhuzhao_to_taskrunner:
        aliases:
          - taskrunner # 供 zhuzhao 以 http://taskrunner:8080 稳定寻址
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/healthz || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
    # 无 ports 段——8080 不对宿主发布（C3）；R5 可写探测在镜像内 /data /logs
    # 已预授权（named volume 首挂继承镜像属主 app），bind mount 改挂时依赖
    # 启动探针 fail-closed 暴露属主问题。

  pgbackup:
    # 每日 02:00 pg_dump 物理备份（对齐 activelist pgbackup 模式；恢复见 backup/README.md）
    image: postgres:15-alpine
    environment:
      PGHOST: postgres
      PGUSER: taskrunner
      PGPASSWORD: ${TASKRUNNER_PG_PASSWORD}
      PGDATABASE: taskrunner
      BACKUP_DIR: /backups
      RETAIN_COUNT: "14"
    volumes:
      - backups:/backups
      - ./backup/backup.sh:/usr/local/bin/backup.sh:ro
    entrypoint: ["/bin/sh", "/usr/local/bin/backup.sh"]
    networks:
      - taskrunner_internal
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

networks:
  taskrunner_internal: {}
  zhuzhao_to_taskrunner:
    external: true

volumes:
  pgdata:
  redisdata:
  backups:
