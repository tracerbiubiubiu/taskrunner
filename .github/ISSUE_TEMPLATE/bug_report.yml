name: Bug report / 问题报告
description: Report a reproducible problem using synthetic or redacted data.
body:
  - type: markdown
    attributes:
      value: "Please remove credentials, company identifiers and private data. Do not disclose security vulnerabilities in a public issue."
  - type: input
    id: version
    attributes:
      label: Version or commit / 版本或提交
      description: Include the repository revision and relevant runtime versions.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction steps / 复现步骤
      description: Provide the smallest reproducible example with synthetic data.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior / 预期结果
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior / 实际结果
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Redacted logs / 脱敏日志
  - type: checkboxes
    id: redaction
    attributes:
      label: Data handling / 数据检查
      options:
        - label: I removed secrets and private or company-identifying data.
          required: true
